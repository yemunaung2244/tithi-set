<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf7fd">
<meta name="description" content="တိထိ၊ အဝတ္ထာန်နှင့် ယုဂ်များကို မြန်မာစံတော်ချိန်ဖြင့် တွက်ချက်ရန်">
<title>တိထိစက်</title>
<link rel="stylesheet" href="./style.css?v=20261127">
</head>
<body>
<header><div class="shell masthead"><a href="#calculator"><span class="brand-icon" aria-hidden="true">◐</span> တိထိစက်</a><span>မြန်မာစံတော်ချိန် <b>UTC+06:30</b></span></div></header>
<main id="calculator" class="shell calculation-page">
<form id="form" class="panel">
<h1>တိထိတွက်ရန်</h1>
<label>စစ်ဆေးလိုသောအချိန်<input id="when" type="datetime-local" min="1600-01-01T00:00" max="2200-12-31T23:59:59" step="1" required></label>
<label>အရပ်တွက်နည်း<select id="method"><option value="current">ရောက်ဆဲ တိထိ</option><option value="hourly">တိထီ ၁ နာရီပိုင်း</option><option value="twelveMin">တိထီ ၁၂ မိနစ်ပိုင်း</option><option value="birth">ဇာတိတိထိ</option><option value="age">တိထီ ၁၂ နှစ်ပိုင်း</option></select></label>
<label id="birth-field"><span>မွေးရက်နှင့် မွေးချိန် <small id="birth-hint" class="field-hint">(၁၂ နှစ်ပိုင်းအတွက် ရွေးချယ်ထည့်နိုင်သည်)</small></span><input id="birth" type="datetime-local" min="1600-01-01T00:00" max="2200-12-31T23:59:59" step="1"></label>
<div class="actions"><button class="primary">တွက်ချက်မည်</button><button id="now" type="button">ယခုအချိန်</button></div>
<p id="error" role="alert" hidden></p>
</form>
</main>
<script type="module" src="./app.mjs?v=20261127"></script>
</body>
</html>
